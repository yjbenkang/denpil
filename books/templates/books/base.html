<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DENPIL{% endblock %}</title>

    <!-- Google Fonts 사용 -->
    <link href="https://fonts.googleapis.com/earlyaccess/notosanskr.css" rel="stylesheet">
    <style>
        /* 기본적인 Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            //background-color: #dbd6d0;
            font-family: 'Noto Sans KR', serif;
            color: #333;
            line-height: 1.6;
            padding: 40px;
        }

        h2 {
            font-size: 22px;
            color: #4a4a4a;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #d1c4a9;
            padding-bottom: 5px;
        }
        #navbar {
            position: fixed;
            top: -10px;  /* 처음에 숨김 */
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #555;
            color: #d1c4a9;
            padding: 20px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: top 0.5s ease;
        }

        /* 프로젝트 제목 */
        #project-title {
            font-size: 24px;
            font-weight: bold;
            margin-left: 20px;
        }

        /* 메뉴 탭 스타일 */
        .menu {
            list-style: none;
            display: flex;
            margin-right: 20px;
        }

        .menu li {
            margin: 0 15px;
        }

        .menu a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            padding: 5px 10px;
            transition: background-color 0.3s ease;
        }

        /* 페이지 컨텐츠 스타일 */
        .content {
            padding: 100px;
            text-align: center;
        }

        /* 전체 컨테이너 */
        .container {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 10px;
            border: 1px solid #d1c4a9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .contents {
            width: 900px;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        /* 반응형 그리드: 화면이 작아질 때 열 수를 줄임 */
        @media (max-width: 768px) {
            .contents ul {
                grid-template-columns: repeat(2, 1fr); /* 2개의 열 */
            }
        }

        @media (max-width: 480px) {
            .contents ul {
                grid-template-columns: 1fr; /* 1개의 열 */
            }
        }

        /* 버튼 스타일 */
        button {
            background-color: transparent;
            color: #b09c64;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #777;
        }

        /* 반응형 레이아웃 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .author-list,
            .contents {
                width: 100%;
            }
        }
    </style>
    {% block extra_head %}
    {% endblock %}
</head>
<body>

    <!-- 공통 상단 메뉴 -->
    <div id="navbar">
        <div id="project-title">DENPIL</div>
        <ul class="menu">
            <li><a href="{% url 'book_list' %}">목록</a></li>
            <li><a href="{% url 'stat' %}">통계</a></li>
        </ul>
    </div>

    <!-- 각 페이지에서 내용이 들어갈 부분 -->
    {% block content %}
    {% endblock %}

    <script>
        // 상단바가 마우스를 상단으로 가져가면 내려오고, 내려가면 숨김
        document.addEventListener('mousemove', function(event) {
            var navbar = document.getElementById('navbar');
            if (event.clientY < 60) {  // 마우스가 상단 60px 이내로 이동할 때
                navbar.style.top = '0';  // 상단바 보이기
            } else {
                navbar.style.top = '-60px';  // 상단바 숨기기
            }
        });
    </script>

    {% block extra_scripts %}
    {% endblock %}
</body>
</html>
